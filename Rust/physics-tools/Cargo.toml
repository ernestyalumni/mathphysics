[package]
name = "physics-tools"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded JSON bridge to existing exact Clifford traces"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
qft-symbolics = { path = "../qft-symbolics" }

[profile.release]
overflow-checks = true
panic = "unwind"
